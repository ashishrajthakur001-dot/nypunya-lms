server:
  port: ${PORT:8085}
spring:
  application:
    name: progress-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nypunya_lms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
security:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-to-a-long-random-secret}
