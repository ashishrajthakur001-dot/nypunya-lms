name: NypunyaLMS CI

on:
  push:
    branches: [main, 'feature/**', 'build/**', 'prototype/**']
  pull_request:
    branches: [main]

concurrency:
  group: nypunya-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build backend reactor
        run: mvn -B -f backend/pom.xml clean verify

  container-build:
    name: Build backend containers
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile.user.vercel
          - Dockerfile.course.vercel
          - Dockerfile.assignment.vercel
          - Dockerfile.assessment.vercel
          - Dockerfile.progress.vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build container image
        run: docker build -f backend/${{ matrix.dockerfile }} backend
